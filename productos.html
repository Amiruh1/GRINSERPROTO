<head>

  <meta name="theme-color" content="#215f9a">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="products-hero">
      <div class="wrap products-hero-inner">
        <div><span class="kicker kicker-light">Catálogo Grinser</span><h1>Todo para que tu oficina siga avanzando.</h1><p>Encuentra equipos, consumibles y repuestos con asesoría de nuestro equipo.</p></div>
        <a class="btn btn-primary btn-lg" href="index.html?categoria=ofertas#tienda">Ver ofertas <i data-icon="arrow-right" data-size="18"></i></a>
      </div>
    </section>

      <div class="section-head">
        <div><span class="kicker">Nuestro catálogo</span><h2 id="products-title">Productos disponibles</h2></div>
