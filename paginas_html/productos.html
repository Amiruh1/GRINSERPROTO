<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Productos | Grinser</title>
  <meta name="description" content="Explora impresoras, fotocopiadoras, tóner, tintas, repuestos y accesorios de Grinser.">
  <meta name="theme-color" content="#215f9a">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=20261128-2">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="wrap shop-page">
    <nav class="crumbs" aria-label="Ruta">
      <a href="../index.html">Inicio</a><i data-icon="chevron-right" data-size="13"></i><span aria-current="page" id="crumb-current">Productos</span>
    </nav>

    <div class="shop-layout">
      <!-- Filtros -->
      <aside class="shop-filters" aria-label="Filtros">
        <div class="sf-head">
          <h2><i data-icon="sliders" data-size="19"></i> Filtros</h2>
          <button type="button" class="btn btn-sm sf-toggle" id="sf-toggle" aria-expanded="false" aria-controls="sf-body">Mostrar</button>
        </div>
        <div class="sf-body" id="sf-body">
          <div class="sf-scope">
            <a href="productos.html" class="sf-back" id="sf-back" hidden><i data-icon="chevron-left" data-size="13"></i> Ver todo el catálogo</a>
            <h3 id="sf-scope-title">Todo el catálogo</h3>
          </div>
          <label class="sf-search">
            <i data-icon="search" data-size="16"></i>
            <span class="sr-only">Buscar en esta sección</span>
            <input id="sf-q" type="search" placeholder="Buscar en esta sección" autocomplete="off">
          </label>
          <div id="sf-sections"></div>
        </div>
      </aside>

      <!-- Resultados -->
      <section class="shop-results" aria-labelledby="shop-title">
        <div class="shop-head">
          <div><span class="kicker">Catálogo</span><h1 id="shop-title">Todos los productos</h1></div>
          <label class="sort">Ordenar
            <select id="shop-sort">
              <option value="recientes">Más recientes</option>
              <option value="precio-asc">Menor precio</option>
              <option value="precio-desc">Mayor precio</option>
              <option value="descuento">Mayor descuento</option>
              <option value="nombre">Nombre (A-Z)</option>
            </select>
          </label>
        </div>
        <div class="sf-chips" id="sf-chips" aria-label="Filtros aplicados" hidden></div>
        <p class="sr-only" id="shop-count" role="status"></p>
        <div id="shop-grid" class="pc-grid"><p class="muted">Cargando catálogo…</p></div>
        <p class="products-note">¿Necesitas ayuda para elegir? <a href="servicio-tecnico.html">Conoce nuestro servicio técnico</a> o consúltanos por WhatsApp.</p>
      </section>
    </div>
  </main>
  <footer id="site-footer" class="footer"></footer>
  <script src="../js/productos.js"></script>
  <script src="../js/categorias.js?v=category-name-1"></script>
  <script src="../js/sheets-config.js?v=sheets-url-3"></script>
  <script src="../js/data.js?v=accounts-central-1"></script>
  <script src="../js/whatsapp-widget.js"></script>
  <script src="../js/auth.js?v=accounts-central-1"></script>
  <script src="../js/site-shell.js?v=checkout-2"></script>
  <script src="../js/product-card.js?v=20261128-1"></script>
  <script src="../js/productos-page.js?v=product-detail-2"></script>
</body>
</html>
